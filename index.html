<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Berry FFLogs Companion</title>
    <script>
      try {
        const savedTheme = localStorage.getItem('berry-theme');
        document.documentElement.dataset.theme = savedTheme
          || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
      } catch {
        document.documentElement.dataset.theme = 'dark';
      }
    </script>
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="app-shell">
      <div class="workspace">
        <header class="masthead">
          <p class="eyebrow">Berry FFLogs Companion</p>
          <button class="theme-toggle-button" id="themeToggleButton" type="button">Light mode</button>
          <h1>FFLogs Analyzer for DMU</h1>
        </header>

        <div class="dashboard-grid">
          <section class="account-panel" aria-labelledby="accountName">
            <div class="account-copy">
              <p class="eyebrow">User data</p>
              <h2 id="accountName">FFLogs account</h2>
            </div>
            <button id="authButton" type="button">Log in to FFLogs</button>
            <p class="auth-state" id="authState">Not logged in</p>
            <p class="status-line" id="statusLine" role="status">Log in with FFLogs to get started.</p>
          </section>

          <section class="reports-panel" aria-labelledby="reportsTitle">
            <div class="reports-header">
              <div>
                <p class="eyebrow">Last 7 days</p>
                <h2 id="reportsTitle">Reports</h2>
              </div>
              <div class="reports-actions">
                <button class="test-data-button" id="testDataButton" type="button">Use test data</button>
                <span class="report-count" id="reportCount">0 reports</span>
              </div>
            </div>
            <p class="reports-status" id="reportsStatus">Log in to load reports.</p>
            <div class="reports-list" id="reportsList"></div>
          </section>

          <section class="report-lookup-panel" aria-labelledby="reportSearchTitle">
            <form class="report-search-form" id="reportSearchForm">
              <label for="reportSearchInput" id="reportSearchTitle">Load an FFLogs report</label>
              <div class="report-search-controls">
                <input
                  id="reportSearchInput"
                  list="recentReportCodes"
                  type="text"
                  autocomplete="off"
                  placeholder="FFLogs report URL or report code"
                  spellcheck="false"
                >
                <button id="loadReportButton" type="submit">Load report</button>
              </div>
              <p>Paste an FFLogs report URL or enter its report code.</p>
              <datalist id="recentReportCodes"></datalist>
            </form>
            <p class="lookup-status" id="lookupStatus" role="status" hidden></p>
            <div class="lookup-result" id="lookupResult"></div>
          </section>
        </div>
      </div>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>

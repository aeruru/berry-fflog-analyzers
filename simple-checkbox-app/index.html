<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Grading Checklist</title><link rel="stylesheet" href="styles.css"><script src="app.js" defer></script></head><body>
<header><h1 id="page-title">Grading Checklist</h1><div class="actions"><label class="zoom">Zoom <input id="zoom-slider" type="range" min="50" max="500" step="10" value="100"><output id="zoom-value">100%</output></label><button id="save-button">Save text</button><button id="undo-button" disabled>Undo</button><button id="mark-x-button">Mark remaining X</button><button id="reset-button">Reset</button></div></header>
<main id="checklist" aria-busy="true"></main><p id="error" hidden></p>
<footer aria-live="polite"><span id="progress-label">0/0</span><span id="star-progress">0/0</span></footer>
</body></html>
